name: Picmake
options:
  bundleIdPrefix: uk.zenohy
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.9'
    TARGETED_DEVICE_FAMILY: '1'
    DEVELOPMENT_TEAM: '27V23KNM5P'
    CODE_SIGN_STYLE: Automatic
targets:
  Picmake:
    type: application
    platform: iOS
    sources:
      - path: Picmake
        excludes: [Renderer]
      - path: Picmake/Renderer
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.zenohy.picmake
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 展会制图
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 将导出的海报保存到你的相册。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PicmakeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PicmakeTests]
    dependencies:
      - target: Picmake
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  PicmakeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PicmakeUITests]
    dependencies:
      - target: Picmake
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Picmake:
    build:
      targets:
        Picmake: all
    test:
      targets: [PicmakeTests, PicmakeUITests]
